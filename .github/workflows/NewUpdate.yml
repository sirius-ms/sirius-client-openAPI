name: NewUpdate

on:
  workflow_dispatch:
    inputs:
      target_branch:
        type: string
        required: true
        description: "Target branch to put update commits on."
      sirius_version:
        description: "Optional SIRIUS version to download (e.g. 6.3.3). Leave blank for latest."
        type: string
        required: false
      allow_breaking_api_changes:
        description: "Label the resulting pull request so the CompatGate check accepts an update that removes or changes parts SDK users rely on. The PR and the report are produced either way. Only for deliberate breaking releases."
        type: boolean
        required: false
        default: false

jobs:
  UpdateClients:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
      - name: Download latest generators
        run: |
          mkdir .updater/openapi_generator
          cd .updater/openapi_generator
          wget -nv https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar -O openapi-generator-cli-7.10.jar
          wget -nv https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.16.0/openapi-generator-cli-7.16.0.jar -O openapi-generator-cli-7.16.jar
      - name: Download SIRIUS Release
        uses: nick-fields/retry@v4
        with:
          max_attempts: 5
          timeout_minutes: 5
          command: |
            cd .updater/api
            
            if [ -n "${{ github.event.inputs.sirius_version }}" ]; then
              # Manual version provided
              version="${{ github.event.inputs.sirius_version }}"
              echo "Using manually provided SIRIUS version: $version"          
            else
              # Fallback to automatic latest detection
              echo "No version provided — fetching latest release..."
              version=$(curl -s https://api.github.com/repos/sirius-ms/sirius/releases/latest | jq -r '.tag_name' | sed 's/^v//')
              echo "Latest version: $version"
            fi
            
            echo "$version" > ./packageVersion.txt
            url="https://github.com/sirius-ms/sirius/releases/download/v${version}/sirius-${version}-linux-x64.zip"
            echo "Downloading from: $url"
            wget -nv "$url" -O sirius-${version}-linux-x64.zip
            
            echo "Unzipping..."
            unzip -q sirius-*-linux-x64.zip
            echo "API Ready"
      - name: Install Display Drivers & Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libasound2t64 libx11-xcb1 libnss3 libxss1
      - name: Run Rest Api with strings
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bash .updater/api/sirius/bin/sirius REST --api-mode=STABLE -p 8080 -s &
      - name: Update api-docs-strings.json
        run: |
          while ! nc -z localhost 8080; do sleep 0.1; done
          wget -nv http://localhost:8080/v3/api-docs -O api-docs-strings.json
        working-directory: .updater/api
      - name: Shutdown SIRIUS
        run: curl -X POST http://localhost:8080/actuator/shutdown
      - name: Run Rest Api with enums
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
          bash .updater/api/sirius/bin/sirius REST --api-mode=STABLE --enums-as-ref -p 8080 -s &
      - name: Update api-docs-enums.json
        run: |
          while ! nc -z localhost 8080; do sleep 0.1; done
          wget -nv http://localhost:8080/v3/api-docs -O api-docs-enums.json
        working-directory: .updater/api
      - name: Shutdown SIRIUS
        run: curl -X POST http://localhost:8080/actuator/shutdown
      - name: Format JSON files
        run: |
          sudo apt-get install -y moreutils
          jq . api-docs-strings.json | sponge api-docs-strings.json
          jq . api-docs-enums.json | sponge api-docs-enums.json
        working-directory: .updater/api
      - name: Update Clients
        run: |
          # load package version from file
          packageVersion=$(cat .updater/api/packageVersion.txt)
          
          echo "generating Python Code with packageVersion=$packageVersion"
          rm -rf client-api_python/generated/docs
          rm -rf client-api_python/generated/PySirius
          
          java -jar .updater/openapi_generator/openapi-generator-cli-7.16.jar generate -i .updater/api/api-docs-enums.json -c .updater/config/Python/config.json -g python -o client-api_python/generated -t client-api_python/templates/python --additional-properties=packageVersion=$packageVersion
          
          echo "temporarily move R manual folder"
          mv client-api_r/generated/man/ client-api_r/
          
          echo "generating R Code with packageVersion=$packageVersion"
          rm -rf client-api_r/generated/docs
          rm -rf client-api_r/generated/R
          
          java -jar .updater/openapi_generator/openapi-generator-cli-7.10.jar generate -i .updater/api/api-docs-strings.json -c .updater/config/R/config.json -g r -o client-api_r/generated -t client-api_r/templates/r --additional-properties=packageVersion=$packageVersion
          
          echo "recover R manual folder"
          mv client-api_r/man/ client-api_r/generated/
          
          echo "generating Finished!"
      - name: Format Python Package
        run: |
          cp pysirius_api.py generated/PySirius
          cp pysirius_sdk.py generated/PySirius
          cp pysirius_helper.py generated/PySirius
          cp pysirius_compat.py generated/PySirius
          
          chmod +x ./formatting/format_init.sh
          ./formatting/format_init.sh
        working-directory: client-api_python
      - name: Format R package
        run: |
          cp rsirius_sdk.R  generated/R/rsirius_sdk.R
          cp rsirius_helper.R  generated/R/rsirius_helper.R
          cp rsirius_compat.R  generated/R/rsirius_compat.R
          echo >> generated/NAMESPACE
          echo "# SDK" >> generated/NAMESPACE
          echo "export(SiriusSDK)" >> generated/NAMESPACE
          echo "export(Helper)" >> generated/NAMESPACE
          
          chmod +x ./patches/list_syntax_fix.sh
          ./patches/list_syntax_fix.sh
          
          chmod +x ./patches/insert_wait_for_job_completion_in_rsirius_api.sh
          ./patches/insert_wait_for_job_completion_in_rsirius_api.sh
        working-directory: client-api_r
      - name: Set up R for the surface extractor
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Check backward compatibility
        # Two levels, both against the committed state (= the previous release), so there is no
        # extra baseline to maintain:
        #   spec   - operations/schemas/properties removed, renamed, retyped, newly mandatory
        #   SDK    - the generated surface, which also catches breakage a generator upgrade causes
        #            while the spec stays byte identical
        # Removing something the previous release already marked [EXPERIMENTAL]/[INTERNAL]/
        # [DEPRECATED] is allowed. This only reports, so that a breaking update still produces a
        # branch, generated clients and a pull request to build the workaround on. The blocking
        # check is the CompatGate job in RunTests.yml, which runs on the pull request itself.
        id: compat
        run: |
          out="${RUNNER_TEMP}/compat"
          mkdir -p "$out"

          for f in api-docs-strings.json api-docs-enums.json sdk-surface-python.json sdk-surface-r.json; do
            git show "HEAD:.updater/api/$f" > "$out/old-$f" 2>/dev/null || : > "$out/old-$f"
          done

          if [ -s "$out/old-api-docs-strings.json" ]; then
            python3 .updater/tools/api_compat_check.py "$out/old-api-docs-strings.json" \
              .updater/api/api-docs-strings.json --report-only --label "R / strings" \
              --json "$out/spec-r.json"
          fi
          if [ -s "$out/old-api-docs-enums.json" ]; then
            python3 .updater/tools/api_compat_check.py "$out/old-api-docs-enums.json" \
              .updater/api/api-docs-enums.json --report-only --label "Python / enums" \
              --json "$out/spec-python.json"
          fi

          python3 .updater/tools/sdk_symbols.py python -o .updater/api/sdk-surface-python.json
          python3 .updater/tools/sdk_symbols.py r      -o .updater/api/sdk-surface-r.json

          python3 .updater/tools/sdk_compat_check.py "$out/old-sdk-surface-python.json" \
            .updater/api/sdk-surface-python.json --report-only --json "$out/sdk-python.json"
          python3 .updater/tools/sdk_compat_check.py "$out/old-sdk-surface-r.json" \
            .updater/api/sdk-surface-r.json --report-only --json "$out/sdk-r.json"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 .updater/tools/render_compat_report.py -o "$out/compat-report.md" \
            "$out/spec-r.json" "$out/spec-python.json" "$out/sdk-python.json" "$out/sdk-r.json" \
            --intro "SIRIUS \`$(cat .updater/api/packageVersion.txt)\`, produced by [this update run]($run_url)." \
            --max-bytes 60000 \
            --artifact-hint "The full list is in the \`compat-report\` artifact of [this run]($run_url)."

          cat "$out/compat-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: ${{ runner.temp }}/compat
          if-no-files-found: warn
      - name: Remove Sirius Rest Api
        run: |
          rm -rf *sirius*
          rm -rf releases.json
          echo "Done"
        working-directory: .updater/api
      - name: Remove Openapi Generator Files
        run: |
          rm -rf .updater/openapi_generator
          ls ./.github/workflows
          echo "Done"
      - name: update file and push to remote
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto-Updated OpenAPI Clients
      - name: Run RManualGeneration
        run: |
          id=$(gh workflow run RManualGeneration.yml --ref ${GITHUB_REF_NAME} | grep -oP '(?<=runs/)\d+')
          echo "run ID of RManualGeneration is: $id"
          gh run watch $id --exit-status --interval 10
          echo "generation done!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update file and create pull request
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          body="${RUNNER_TEMP}/compat/pr-body.md"
          {
            echo "Automatic client updates from update workflows."
            echo
            cat "${RUNNER_TEMP}/compat/compat-report.md"
          } > "$body"
          if pr_url=$(gh pr create \
            --base ${{ inputs.target_branch }} \
            --title "AutoUpdated" \
            --body-file "$body" \
            --label "Feature"); then
            echo "opened $pr_url"
          else
            # the pull request already exists (re-run on the same branch): refresh its body so the
            # compatibility report describes this run, not the previous one
            pr_url=$(gh pr view --json url --jq '.url')
            gh pr edit --body-file "$body" || echo "could not refresh the pull request body"
          fi
          pr_number=$(gh pr view --json number --jq '.number')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "pr_created=true" >> $GITHUB_OUTPUT
      - name: Flag breaking changes on the pull request
        if: steps.compat.outputs.breaking != '' && steps.compat.outputs.breaking != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh label create breaking-change --color B60205 \
            --description "Update breaks the generated SDK surface" --force
          gh pr edit ${{ steps.open-pr.outputs.pr_number }} --add-label breaking-change

          # this is what allow_breaking_api_changes now does: the gate runs on the pull request, so
          # the decision has to travel to the pull request as a label
          if [ "${{ inputs.allow_breaking_api_changes }}" = "true" ]; then
            gh label create allow-breaking-api-changes --color 0E8A16 \
              --description "CompatGate accepts the breaking changes in this pull request" --force
            gh pr edit ${{ steps.open-pr.outputs.pr_number }} --add-label allow-breaking-api-changes
          fi
      - name: check if request has been created
        run: echo ${{steps.open-pr.outputs.pr_created}}
      - name: lock pull request
        continue-on-error: true
        id: lockpull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/issues/${{steps.open-pr.outputs.pr_number}}/lock \
            -f lock_reason=resolved
      - name: Run tests if no changes occure
        if: steps.lockpull.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat .updater/api/packageVersion.txt)
          echo "Running RunTests workflow with SIRIUS version: $version"
          id=$(gh workflow run RunTests.yml --ref ${GITHUB_REF_NAME} -f sirius_version="$version" | grep -oP '(?<=runs/)\d+')
          echo "run ID of RunTests is: $id"
          gh run watch $id --exit-status --interval 10
